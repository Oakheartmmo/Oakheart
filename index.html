<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oakheart</title>
<style>
:root{--bg:#e9e6da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201a;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#game{width:100%;height:100%;touch-action:none}
#game canvas{touch-action:none;display:block}

.start{position:fixed;inset:0;z-index:50;display:flex;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#2b4a2e 0,#14201a 70%);color:#f1e9c8;font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none}
.start[hidden]{display:none}
.start *{box-sizing:border-box}
.sbox{margin:auto;width:min(460px,100%);background:#2c2f38;border:2px solid #c9982a;border-radius:10px;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.stitle{text-align:center}
.stitle h1{margin:0;font-size:34px;letter-spacing:3px;color:#ffe066;text-shadow:0 3px 0 #5b3a1c;text-transform:uppercase}
.stitle p{margin:4px 0 0;color:#a89a78;font-size:13px;letter-spacing:1px}
.spane{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.spane[hidden]{display:none}
.sprev{width:160px;height:160px;align-self:center;image-rendering:pixelated;background:#4f8a34;border:2px solid #c9982a;border-radius:8px}
.sline{margin:0;text-align:center;font-size:15px}
.sbtns{display:flex;flex-direction:column;gap:10px}
.sb{font:inherit;font-size:15px;color:#f1e9c8;background:#1f2229;border:1px solid #c9982a;border-radius:6px;min-height:46px;padding:8px 14px;cursor:pointer}
.sb:hover:not(:disabled){border-color:#ffe066}
.sb:focus-visible,.so:focus-visible,.sin:focus-visible{outline:3px solid #ffe066;outline-offset:2px}
.sb.primary{background:linear-gradient(#e0b040,#a87818);border-color:#5a400c;color:#1a1206;font-weight:700}
.sb.warn{background:#7a2418;border-color:#c0392b;color:#fff}
.sb:disabled{opacity:.45;cursor:default}
.slogin{display:flex;flex-direction:column;gap:8px;border-top:1px solid #4a4f5c;padding-top:14px}
.slogin label,.srow>span{font-size:12px;color:#a89a78;letter-spacing:1px;text-transform:uppercase}
.slogin label{display:flex;flex-direction:column;gap:4px}
.sin{font:inherit;font-size:15px;color:#f1e9c8;background:#16181d;border:1px solid #c9982a;border-radius:6px;min-height:42px;padding:6px 10px;-webkit-user-select:text;user-select:text;width:100%}
.sin:disabled{opacity:.5}
.snote{margin:0;font-size:12px;color:#a89a78;line-height:1.4}
.srow{display:flex;flex-direction:column;gap:6px}
.sopts{display:flex;flex-wrap:wrap;gap:8px}
.so{font:inherit;font-size:13px;color:#f1e9c8;background:#1f2229;border:2px solid #4a4f5c;border-radius:6px;min-height:38px;min-width:38px;padding:4px 10px;cursor:pointer}
.so.col{width:38px;padding:0;border-color:#16181d}
.so[aria-checked="true"]{border-color:#ffe066;box-shadow:0 0 0 2px #14161b inset}
.so.txt[aria-checked="true"]{background:#3d3622}
.serr{margin:0;min-height:1.2em;font-size:13px;color:#ff8a7a}
.srow2{display:flex;gap:10px;flex-wrap:wrap}
.srow2{flex-wrap:nowrap}
.srow2 .sb{flex:1 1 0;min-width:0;padding:6px 8px;font-size:14px}
.srow2 #bDone{flex:1.6 1 0}
/* the buttons stay on screen at the bottom while the options scroll, so phones can always reach Start */
.sfoot{position:sticky;bottom:0;margin:0 -18px -20px;padding:10px 18px 14px;background:#2c2f38;border-top:1px solid #4a4f5c;border-radius:0 0 8px 8px;z-index:2}
.start{padding-bottom:0}
.sbox{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.start{overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
@media (max-height:780px){.sprev{width:96px;height:96px}.sbox{padding:14px;gap:10px}.sfoot{bottom:0;margin:0 -14px -14px;padding:8px 14px 12px}.spane{gap:10px}.stitle h1{font-size:28px}.so{min-height:34px}.so.col{width:34px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<div id="start" class="start" role="dialog" aria-modal="true" aria-label="Oakheart start screen">
  <div class="sbox">
    <div class="stitle"><h1>Oakheart</h1><p>A small adventure</p></div>
    <div id="sMenu" class="spane">
      <canvas id="sPrevM" class="sprev" width="32" height="32" aria-hidden="true"></canvas>
      <p id="sHello" class="sline"></p>
      <div class="sbtns">
        <button id="bPlay" class="sb primary" type="button">Play</button>
        <button id="bEdit" class="sb" type="button">Edit character</button>
        <button id="bNew" class="sb" type="button">New character</button>
      </div>
      <form id="sLogin" class="slogin" aria-label="Online log in, coming soon">
        <label>Username<input id="sUser" class="sin" disabled autocomplete="off" placeholder="Online play is coming soon"></label>
        <label>Password<input id="sPass" class="sin" type="password" disabled autocomplete="off" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"></label>
        <button id="bLogin" class="sb" type="submit" disabled>Log in</button>
        <button id="bSignup" class="sb" type="button" hidden>Create account</button>
        <p id="sAuthErr" class="serr" role="alert"></p>
        <p id="sNote" class="snote">Online accounts are coming soon. For now your game is saved on this device.</p>
      </form>
      <p id="sAcct" class="snote" hidden></p>
    </div>
    <div id="sMake" class="spane" hidden>
      <canvas id="sPrev" class="sprev" width="32" height="32" aria-hidden="true"></canvas>
      <div class="srow"><span>Name</span><input id="sName" class="sin" maxlength="14" autocomplete="off" spellcheck="false" placeholder="Your name"></div>
      <div id="sOpts" class="spane"></div>
      <p id="sErr" class="serr" role="alert"></p>
      <div class="sfoot">
        <div class="srow2">
          <button id="bDone" class="sb primary" type="button">Start</button>
          <button id="bRand" class="sb" type="button">Random</button>
          <button id="bBack" class="sb" type="button">Back</button>
        </div>
      </div>
    </div>
  </div>
</div>

// The XP curve: XP needed for level L is d*(L-1)^2, made cheaper for the early levels (a third of the cost at level 2,
// sliding up to the full cost at level 20). Saves hold XP, not levels, so a change here only ever moves players up.
const XPEASE=L=>Math.min(1,0.35+0.65*(L-1)/19);
const xpAt=(L,d)=>L<=1?0:Math.round(d*(L-1)*(L-1)*XPEASE(L));
const lvOf=(x,d)=>{x=+x||0;let L=1+Math.floor(Math.sqrt(Math.max(0,x)/d));while(xpAt(L+1,d)<=x)L++;return L;}; // MW,WH = the world map (the dungeon is built below it, see MH)
// The screen size follows the window: W,H = visible tiles (can be fractions)
function viewSize(){

  lw=Math.round(lw/2)*2;lh=Math.round(lh/2)*2;   // even sizes: an odd size puts the screen half a pixel off and thin lines (box edges) vanish
  return [lw,lh];
}

const SIGNCFG=[[5,2,"Rat Kings lair. Beware!"],[131,2,"# The Song of the Twice-Born\n*As kept by the Reed Priests of Lowmarsh*\n\n**I. Of the Birth**\nBefore the rivers had names, Frogzor the Twice-Born crawled from the first tidepool. He breathed water and air alike, so he belonged to neither and to both. Where he stepped, the mud grew rich. Where he sang, the frogs answered. From the spawn of his song came the Mirefolk, who still call him Grandfather.\n\n**II. Of the Gifts**\nFrogzor taught us to weave reed-homes that float when the floods come. He taught us which waters heal and which waters drown. He gave us gills for the wet season and lungs for the dry. He gave us the Long Croak, so that kin may call to kin across any marsh.\n\n**III. Of the Listening**\nBut a god who hears two worlds hears too much. Frogzor listened to the deep water, where old things whisper, and to the high air, where storms argue. He tried to hold every voice at once. He did not sleep. He did not stop listening.\n\nIn the Year of Still Water, he dove into the Black Sounding to hear the bottom of the world. When he rose, his eyes no longer closed, and his song had no ending.\n\n**IV. Of the Madness**\nNow Frogzor wanders the Weeping Fen. He speaks to stones as if they were his children. He weeps over puddles. Some days he forgets his own name and asks travellers for theirs, so he might borrow one. Once, in a fit of grief, he swallowed the moon's reflection, and the marsh was dark for nine nights.\n\nOutsiders call him broken. They ask why we do not find a saner god.\n\n**V. Of Why We Love Him**\nBecause he went mad for us. Every voice he listened to was a danger he meant to warn us of. Every night he did not sleep, he kept watch. The madness is the price of his care, and he paid it gladly.\n\nAnd still, he remembers in his way. A Mirefolk child sinking in deep water will feel a great webbed hand beneath her, lifting. When drought cracks the earth, Frogzor weeps the pools full again, though he does not know why he weeps.\n\nSo we leave him offerings: river snails, song-stones, and a name carved on bark, so he never lacks one to borrow. We sing him the songs he once sang to us, so that someone remembers them whole.\n\n**VI. A Prayer of the Mirefolk**\n*Grandfather, you are lost, but we are not.*\n*You forgot us, but we did not forget.*\n*Listen to everything, if you must.*\n*But listen to us first.*\n\n*Here ends the Song of the Twice-Born.*"],[139,19,""],[221,78,""],[87,85,""],[152,151,""]];

function hsFind(x,y){   // which room space (and where inside it) a tile is
  const D=DUNS[houseD()];if(!D)return null;
  for(let s=0;s<6;s++){const [ox,oy]=hsOrigin(s);if(x>=ox&&x<ox+6&&y>=oy&&y<oy+5)return {s,ix:x-ox,iy:y-oy};}
  return null;
}
function hsSpot(x,y){
  const D=DUNS[houseD()];if(!D)return null;
  const f=hsFind(x,y);
  if(f){if(HOUSE.r[f.s]<0)return null;const R=HROOMS[HOUSE.r[f.s]],n=R.spots.findIndex(([a,b])=>a===f.ix&&b===f.iy);return n>=0?{key:f.s+':'+n,kind:R.spots[n][2],where:R.n}:null;}
  const g=HGARDEN.findIndex(([a,b])=>D.x0+a===x&&D.z0+b===y);
  return g>=0?{key:'g:'+g,kind:'garden',where:'garden'}:null;
}

let hsLayer=null,hsSpr=[];
function houseRender(){
  const di=houseD();if(di<0||!scene)return;const D=DUNS[di],DEC=HOUSE.d||{};
  const wall=new Map(),door=new Map(),floor=new Map(),over={};
  HOUSE.r.forEach((rt,s)=>{if(rt<0)return;const [ox,oy]=hsOrigin(s),st=DEC[s]||{},fl=HFLOOR[st.f||0][1],wl=HWALL[st.w||0][1];
    for(let x=ox-1;x<=ox+6;x++)for(let y=oy-1;y<=oy+5;y++){const k=x+','+y;if(x>=ox&&x<ox+6&&y>=oy&&y<oy+5)floor.set(k,fl);else if(!wall.has(k))wall.set(k,wl);}
    const dr=[[ox+2,oy+5],[ox+3,oy+5]];if(oy>D.z0+1)dr.push([ox+2,oy-1],[ox+3,oy-1]);
    dr.forEach(([x,y])=>{const k=x+','+y;if(!door.has(k))door.set(k,fl);});});
  door.forEach((fl,k)=>{wall.delete(k);floor.set(k,fl);});
  for(let y=D.z0;y<D.z0+HSH;y++)for(let x=D.x0;x<D.x0+HSW;x++){
    const k=x+','+y,i=y*MW+x;
    if(x===D.x0+HSEXIT[0]&&y===D.z0+HSEXIT[1])continue;
    if(wall.has(k)){grid[y][x]=wall.get(k);FLOOR[i]='wood';continue;}
    if(floor.has(k)){grid[y][x]='.';FLOOR[i]=floor.get(k);}
    else{grid[y][x]=(x===D.x0||y===D.z0||x===D.x0+HSW-1||y===D.z0+HSH-1)?'Ñ':'.';delete FLOOR[i];}
    const f=hsFind(x,y);
    if(f&&HOUSE.r[f.s]<0&&f.ix===2&&f.iy===2)grid[y][x]='ȸ';   // an empty room space: a sign to build a room
    const sp=hsSpot(x,y);
    if(sp){const code=HOUSE.f[sp.key];
      if(!code)grid[y][x]='ȹ';
      else{const F=hsFurnOf(sp.kind,code);if(code[0]==='_'){if(F)over[k]=F.tex;}else{grid[y][x]=code[0];if(F&&F.tex)over[k]=F.tex;}}}
  }
  hsSpr.forEach(o=>o.destroy());hsSpr=[];
  const add=(x,y,k)=>{if(!k)return;if(scene.textures.exists(k+'_t'))k=k+'_t';if(!scene.textures.exists(k))return;const im=scene.add.image(x*T+T/2,y*T+T/2+OY,k);hsLayer.add(im);hsSpr.push(im);};
  const TX={E:'table',J:'chair',X:'shelf',D:'range',C:'bench',A:'anvil','}':'altar','«':'bankchest','Ⱥ':'bed','Ȼ':'hportal','ȸ':'hsign','ȹ':'hspot'};
  for(let y=D.z0;y<D.z0+HSH;y++)for(let x=D.x0;x<D.x0+HSW;x++){
    const c=grid[y][x],k=x+','+y,fl=FLOOR[y*MW+x];
    {const im0=scene.textures.exists(fl||'grass')?(fl||'grass'):'wood';const im=scene.add.image(x*T+T/2,y*T+T/2+OY,im0);hsLayer.add(im);hsSpr.push(im);}
    if(WALLT[c]){const im=scene.add.image(x*T+T/2,y*T+T/2+OY,thinWall(scene,x,y,c));hsLayer.add(im);hsSpr.push(im);}
    else if(over[k])add(x,y,over[k]);
    else if(TX[c])add(x,y,TX[c]);
  }
}

    document.head.appendChild(st);w=document.createElement('div');w.id='hsWin';document.body.appendChild(w);

  else b.push(['Go to my house','',false,houseEnter]);

// tapping things in the house
function houseTap(tx,ty){
  if(!inHouse())return false;
  const c=grid[ty][tx],f=hsFind(tx,ty);
  const near=fn=>{const path=bfs((x,y)=>Math.max(Math.abs(x-tx),Math.abs(y-ty))===1&&!(x===tx&&y===ty));if(!path){msg("You can't reach that.");return true;}go(path,fn);return true;};
  if(c==='ȸ'&&f)return near(()=>roomMenu(f.s));
  if(c==='ȹ'){const sp=hsSpot(tx,ty);if(sp)return near(()=>furnMenu(sp.key,sp.kind,sp.where));}
  if(c==='ȼ'){const sp=hsSpot(tx,ty),F=sp&&hsFurnOf(sp.kind,HOUSE.f[sp.key]||'');msg(F?'Your '+F.n.toLowerCase()+'. (Hold or right-click to remove it.)':'');return true;}
  if(c==='Ⱥ')return near(()=>{hp=MAXHP;hpUi();ui();msg('You lie down in your comfy bed for a moment. You feel fully rested.');});
  if(c==='Ȼ'){const sp=hsSpot(tx,ty),code=(sp&&HOUSE.f[sp.key])||'',d=HPORT[+code.slice(1)];
    if(!d)return true;return near(()=>hsTeleport(d));}
  return false;
}
function hsTeleport(d){
  let best=null;for(let r=0;r<6&&!best;r++)for(let dy=-r;dy<=r&&!best;dy++)for(let dx=-r;dx<=r&&!best;dx++)if(walkable(d[1]+dx,d[2]+dy)&&!STAIRS[(d[2]+dy)*MW+d[1]+dx])best=[d[1]+dx,d[2]+dy];
  if(!best){msg('The portal flickers but nothing happens.');return;}
  stopChop();walkId++;scene.tweens.killTweensOf(player);px=best[0];py=best[1];player.setPosition(px*T+T/2,py*T+T/2+OY);
  if(stairHook)stairHook();msg('You step through the portal to '+d[0]+'.');
}

function houseLoad(d){
  HOUSE={own:0,r:[-1,-1,-1,-1,-1,-1],f:{},d:{}};
  const h=d&&d.house;if(!h||typeof h!=='object')return;
  HOUSE.own=h.own?1:0;
  if(Array.isArray(h.r))for(let s=0;s<6;s++){const v=h.r[s];HOUSE.r[s]=Number.isInteger(v)&&v>=0&&v<HROOMS.length?v:-1;}
  if(h.f&&typeof h.f==='object')for(const k in h.f){const code=String(h.f[k]||'');let kind=null;
    const m=/^([0-5]):(\d)$/.exec(k),g=/^g:(\d)$/.exec(k);
    if(m){if(HOUSE.r[+m[1]]<0)continue;const sp=HROOMS[HOUSE.r[+m[1]]].spots[+m[2]];if(!sp)continue;kind=sp[2];}
    else if(g&&+g[1]<HGARDEN.length)kind='garden';
    if(kind&&code&&hsFurnOf(kind,code))HOUSE.f[k]=code;}
  if(h.d&&typeof h.d==='object')for(let s=0;s<6;s++){const v=h.d[s];if(!v||HOUSE.r[s]<0)continue;
    HOUSE.d[s]={f:Number.isInteger(v.f)&&v.f>=0&&v.f<HFLOOR.length?v.f:0,w:Number.isInteger(v.w)&&v.w>=0&&v.w<HWALL.length?v.w:0};}
}

function bfs(goal){
  if(goal(px,py))return [];
  const prev={},q=[[px,py]];prev[py*MW+px]=null;
  while(q.length){
    const [x,y]=q.shift();
    for(const [dx,dy] of DIRS){
      const nx=x+dx,ny=y+dy,k=ny*MW+nx;
      if(!walkable(nx,ny)||k in prev)continue;
      prev[k]=[x,y];
      if(goal(nx,ny)){
        const path=[];let c=[nx,ny];
        while(c&&!(c[0]===px&&c[1]===py)){path.unshift({x:c[0],y:c[1]});c=prev[c[1]*MW+c[0]];}
        return path;
      }
      q.push([nx,ny]);
    }
  }
  return null;
}

// Stairs: ">" in the world leads down to "<" in the dungeon, and back
function useStairs(){
  const st=STAIRS[py*MW+px];if(!st)return false;
  const D=DUNS[st.d],down=st.c==='>';
  const tg=down?(D&&D.exit):(D&&(D.back||(WENTL[st.d]||[])[0]));
  if(!tg){msg('The stairs are blocked.');return false;}
  const nb=DIRS.map(([dx,dy])=>[tg[0]+dx,tg[1]+dy]).find(([x,y])=>walkable(x,y)&&!STAIRS[y*MW+x]&&!monAt(x,y));
  if(!nb){msg('Something blocks the way.');return false;}
  if(down)D.back=[px,py];
  stopChop();walkId++;scene.tweens.killTweensOf(player);
  px=nb[0];py=nb[1];player.setPosition(px*T+T/2,py*T+T/2+OY);
  if(stairHook)stairHook();
  msg(down?'You climb down into '+D.name+'...':(DUNS[st.d]&&DUNS[st.d].house?'You head back out into town.':'You climb back up into the daylight.'));
  return true;
}
function go(path,done){
  walkId++;const id=walkId;stopChop();
  scene.tweens.killTweensOf(player);
  (function step(){
    if(id!==walkId)return;
    const n=path.shift();
    if(!n){if(STAIRS[py*MW+px]&&useStairs())return;if(done)done();return;}
    px=n.x;py=n.y;walkAnim(walkMs());
    scene.tweens.add({targets:player,x:n.x*T+T/2,y:n.y*T+T/2+OY,duration:walkMs(),onComplete:step});
  })();
}

// Simple animation without new art: the layers of the character are nudged and tilted
// Head items are drawn 16 pixels taller than the body (room for tall hats, horns, a pumpkin...).
// hdFit lines a head picture up with the head, whatever its height (custom pictures can still be 32x32).
const HDUP=16,HDTALL=k=>/^hd\d+$/.test(k)||k==='band'||k==='hat'||k==='helm';
const hdFit=im=>{try{const h=im.frame.height;im.setOrigin(0.5,h>T?(h-T/2)/h:0.5);}catch(e){}};
const BALD=v=>v>=0&&v!==23&&v!==0;   // head items hide the hair, except the eye patch and the lumberjack headband
const ANIMK=['cape','player','body','feet','net','axe','pik','weapon','bow','gripL','gripR','hands','book','shield','head']   // the shield comes after the hands: it is held in front of them
,HELDK=['shield','book','net','axe','pik','weapon','bow','gripL','gripR'];
// Held items are drawn at the edge of their picture; this moves each kind so its handle sits in the hand
const HOFF={axe:[3,0],net:[3,0],pik:[1,0],wp:[5,-4],sp:[5,0],fl:[-1,0],tw:[0,-4],wd:[4,0],st:[3,0],bw:[5,1]};
const CUSTOMHELD=new Set();   // held pictures that come from your own sprites: they keep the spot the editor gave them
const hoffOf=key=>CUSTOMHELD.has(key)?[0,0]:HOFF[String(key||'').replace(/\d+$/,'')]||[0,0];
// sets each held layer's resting spot and shows a fist over whatever the hands are holding
function gripLayers(L,gripKey){
  ['net','axe','pik','weapon','bow'].forEach(k=>{const l=L[k];if(!l)return;const o=l.visible?hoffOf(l.texture.key):[0,0];l.bx=o[0];l.by=o[1];l.x=o[0];l.y=o[1];});
  const left=['net','axe','pik','weapon','bow'].find(k=>L[k]&&L[k].visible),right=false;   // shields and spellbooks are carried on the arm: no hand drawn over them
  if(L.gripL){L.gripL.bx=0;L.gripL.by=0;L.gripL.x=0;L.gripL.y=0;   // the fist stays on the hand; the item moves into it
    if(left&&!CUSTOMHELD.has(L[left].texture.key)&&scene.textures.exists(gripKey+'L'))L.gripL.setTexture(gripKey+'L').setVisible(true);else L.gripL.setVisible(false);}
  if(L.gripR){if(right&&scene.textures.exists(gripKey+'R'))L.gripR.setTexture(gripKey+'R').setVisible(true);else L.gripR.setVisible(false);}
}
// Staffs are drawn in front of the robe, hood and gloves so they stay easy to see; everything else keeps the normal order
function staffFront(c,on){
  try{const L=c.L,a=c.list;if(!L||!a)return;
    const put=(item,ref,above)=>{const i=a.indexOf(item);if(i<0||a.indexOf(ref)<0)return;a.splice(i,1);const j=a.indexOf(ref);a.splice(above?j+1:j,0,item);};
    if(on){put(L.weapon,L.head,true);put(L.gripL,L.weapon,true);}
    else{put(L.weapon,L.bow,false);put(L.gripL,L.gripR,false);}
  }catch(e){}
}

// Tools are items: bought into the bag, equipped by tapping them, removed from the Gear tab
// Melee weapons share one weapon slot: gear.wp is the tier, gear.wt says which kind (sword, spear, flail, two-handed sword)

const lvXp=L=>{const P=[[1,30],[12,60],[24,100],[36,160],[48,260]];if(L<=1)return 30;for(let i=1;i<5;i++)if(L<=P[i][0]){const a=P[i-1],b=P[i];return Math.round(a[1]+(b[1]-a[1])*(L-a[0])/(b[0]-a[0]));}return 260+(L-48)*8;};

function takeN(id,n){   // remove n of an item, stacks included

function craft(i){

  const lt=/^lt\d$/.test(id)?tr(id):-1;if(lt>=0&&fmlvl()<LTNEED[lt]){msg('You need Firemaking '+LTNEED[lt]+' to make that.');return;}
  if(!ks.every(k=>cnt(k)>=need[k])){msg('You need more materials for that.');return;}
  const freed=ks.reduce((n,k)=>n+(STACKS.test(k)?(cnt(k)<=need[k]?1:0):need[k]),0);
  if(inv.length-freed+1>CAPN()&&!(STACKS.test(id)&&inv.includes(id))){msg('Your bag is full.');return;}
  ks.forEach(k=>takeN(k,need[k]));
  addItem(id,1);taskEvt('craft');

  ui();
}

// If Waterwalk ends while you stand on water, the lake carries you to the nearest shore
function washAshore(){

  for(let r=1;r<60&&!best;r++)for(let dy=-r;dy<=r&&!best;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;

  stopChop();walkId++;scene.tweens.killTweensOf(player);

const REQSK={axe:['Woodcutting',()=>lvl()],net:['Fishing',()=>flvl()],pik:['Mining',()=>mlvl()],wp:['Attack',()=>alvl()],sp:['Attack',()=>alvl()],fl:['Attack',()=>alvl()],tw:['Attack',()=>alvl()],wd:['Magic',()=>mglvl()],st:['Magic',()=>mglvl()],bk:['Magic',()=>mglvl()],bw:['Archery',()=>arlvl()],ar:['Archery',()=>arlvl()],hd:['Defense',()=>dflvl()],bd:['Defense',()=>dflvl()],hn:['Defense',()=>dflvl()],ft:['Defense',()=>dflvl()],sh:['Defense',()=>dflvl()]};
function reqLv(id){
  const k=kd(id),t=tr(id);
  if(isChain(id))return MIDL[t-23];   // chainmail: Defense 6, 18, 30, 42, 54
  if(isLeather(id))return NEEDL[leatherT(id)];
  if(id==='hd9')return SL(40);
  if(id==='st5')return SL(30);
  if((k==='hd'||k==='bd')&&t===15)return SL(30);
  if(id==='hd16')return SL(10);
  if(id==='hd22'||id==='bd21'||id==='sp5'||id==='cp4'||id==='hd24'||id==='bd22'||id==='hd25'||id==='hd26'||id==='cp5'||id==='hd27'||id==='bd28'||id==='cp6'||id==='hd28')return 1;
  if(id==='hd23')return NEEDL[2];   // the Bandit Chief's eye patch: worn at the same Defense level as steel   // the demon costume: anyone can wear it
  if(id==='sh5')return NEEDL[2];   // the bone shield: worn at the same Defense level as steel
  if((k==='hd'||k==='bd')&&t>=10)return NEEDL[t-10];
  if(k==='hd'||k==='bd')return t>=3&&t<8?NEEDL[t-3]:1;
  if(k==='hn'||k==='ft')return [1,10,30,40].map(SL)[t]||1;
  if(k==='ar'&&t>=5)return SL(5+10*(t-5));   // tipped arrows: Archery 6, 18, 30, 42, 54
  return NEEDL[t]||1;
}
function reqMsg(id){
  const k=kd(id),r=isLeather(id)?['Archery',()=>arlvl()]:((k==='hd'||k==='bd')&&tr(id)>=10&&!isChain(id)&&id!=='hd22'&&id!=='hd23'&&id!=='bd21'&&id!=='hd24'&&id!=='bd22'&&id!=='hd25'&&id!=='hd26'&&id!=='hd27'&&id!=='bd28'&&id!=='hd28')?['Magic',()=>mglvl()]:REQSK[k];
  if(!r)return '';
  const need=reqLv(id);
  return r[1]()>=need?'':'You need '+r[0]+' '+need+' to use the '+nm(id)+'.';
}

function equip(i){

const bigN=n=>n>=1e7?Math.floor(n/1e6)+'M':n>=1e5?Math.floor(n/1e3)+'k':String(n);
function depositCoins(a){
  const n=Math.min(a,coins);if(n<=0){msg('You have no coins to deposit.');return;}
  coins-=n;bank.coin=Math.min(2e9,(bank.coin||0)+n);
  msg('Deposited '+n.toLocaleString('en-US')+' coins.');ui();save();
}
function withdrawCoins(a){
  const have=bank.coin||0,n=Math.min(a,have);
  if(n<=0)return;
  if(coins<=0&&inv.length>=CAPMAX){msg('Your bag is full.');return;}
  bank.coin=have-n;if(!bank.coin)delete bank.coin;coins+=n;
  msg('Withdrew '+n.toLocaleString('en-US')+' coins.');ui();save();
}
// Bank: stores stacks of any item. The amount button sets how many move per tap.
function deposit(id,amt){
  let n=amt||BK_AMT[bkMode],moved=0;
  if(STACKS.test(id)){moved=Math.min(n,cnt(id));if(moved>=cnt(id))purge(id);else stk[id]-=moved;}
  else for(let j=inv.length-1;j>=0&&moved<n;j--)if(inv[j]===id){inv.splice(j,1);moved++;}
  if(!moved)return;
  bank[id]=(bank[id]||0)+moved;
  msg('Deposited '+moved+' x '+nm(id)+'.');
  ui();
}
function withdraw(id,amt){
  amt=amt||BK_AMT[bkMode];
  const have=bank[id]||0,n=STACKS.test(id)?(canAdd(id)?Math.min(amt,have):0):Math.min(amt,have,CAPN()-inv.length);
  if(n<=0){msg(have?'Your bag is full.':'');return;}
  if(STACKS.test(id))addItem(id,n);else for(let i=0;i<n;i++)inv.push(id);
  bank[id]=have-n;if(!bank[id])delete bank[id];
  msg('Withdrew '+n+' x '+nm(id)+'.');
  ui();
}
function depositAll(){
  if(coins>0){bank.coin=Math.min(2e9,(bank.coin||0)+coins);coins=0;}
  const n=inv.reduce((a,id)=>a+(STACKS.test(id)?stackN(id):1),0);
  if(!n){msg('Deposited your coins.');ui();return;}
  inv.forEach(id=>{bank[id]=(bank[id]||0)+(STACKS.test(id)?stackN(id):1);});
  inv.length=0;for(const k in stk)delete stk[k];
  msg('Deposited everything ('+n+' items).');
  ui();
}

}

// Smithing: smelt ore into bars at the furnace, then forge bars into gear at the anvil
function startSmelt(){
  if(!inv.some(i=>ORES.includes(i))){msg('You have no ore to smelt. Mine some first.');return;}
  if(!inv.some(i=>ORES.includes(i)&&smlvl()>=SMREQ[ORES.indexOf(i)])){msg('You need a higher Smithing level to smelt that ore.');return;}
  msg('You feed the furnace...');
  chopEvt=scene.time.addEvent({delay:1000*(1-gspeed()),loop:true,callback:()=>{
    const i=inv.findIndex(o=>ORES.includes(o)&&smlvl()>=SMREQ[ORES.indexOf(o)]);
    if(i<0){stopChop();if(inv.some(o=>ORES.includes(o)))msg('You need a higher Smithing level to smelt the rest.');return;}
    const ti=ORES.indexOf(inv[i]),before=smlvl();
    inv[i]=BARS[ti];sxp+=SMXP[ti];
    msg(smlvl()>before?'Level up! Smithing is now '+smlvl()+'.':'You smelt a '+nm(BARS[ti])+'.');
    ui();
  }});
}
function smith(i){
  const row=SMITH.filter(r=>r[4]===smCat)[i];if(!row)return;
  const [id,bars,req,xpg]=row;
  if(smlvl()<req){msg('You need Smithing '+req+' for that.');return;}
  const bid=BARS[barTier(id)];
  if(cnt(bid)<bars){msg('You need '+bars+' '+nm(bid)+'s for that.');return;}
  let n=bars;for(let j=inv.length-1;j>=0&&n>0;j--)if(inv[j]===bid){inv.splice(j,1);n--;}
  const before=smlvl();
  inv.push(id);sxp+=xpg;taskEvt('smith');
  msg('You forge a '+nm(id)+'.'+(smlvl()>before?' Smithing is now '+smlvl()+'!':' Equip it from your bag.'));
  ui();
}

const nowMs=()=>Date.now()+clockOffset;

const tbPl=s=>/f$/.test(s)?s.slice(0,-1)+'ves':/(s|x|ch|sh)$/.test(s)?s+'es':s+'s';
function tbText(t){
  switch(t.k){

function tbMake(){
  const R=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
  const mk={
    kill:()=>{
      const ks=[...new Set(MON_SPAWNS.map(q=>q[0]))].filter(k=>{const t=MT[k];return t&&!t.boss&&!t.person&&!t.passive&&t.dmg[1]>0&&monLvl(t)<=clvl()+10;});
      if(!ks.length)return null;
      const t=MT[pick(ks)],L=monLvl(t),n=L<=8?R(10,18):L<=20?R(8,14):L<=40?R(6,10):R(4,7);
      return{k:'kill',t:t.name,n,r:25+Math.round(n*(3+L*0.9)),x:Math.round(n*t.xp*0.5)};
    },
    chop:()=>{
      const a=[0,1,2,3,4].filter(i=>lvl()>=NEEDL[i]&&axe>=i);if(!a.length)return null;
      const i=pick(a),n=Math.max(6,R(10,20)-2*i);
      return{k:'chop',t:i,n,r:20+n*(3+3*i),x:Math.round(n*WCXP[i]*0.5)};
    },
    mine:()=>{
      const a=[0,1,2,3,4].filter(i=>pik>=0&&mlvl()>=NEEDL[i]&&pik>=pikNeed(i));if(!a.length)return null;
      const i=pick(a),n=Math.max(4,R(6,14)-i);
      return{k:'mine',t:i,n,r:25+n*(5+4*i),x:Math.round(n*MNXP[i]*0.5)};
    },
    fish:()=>{
      const a=[0,1,2,4].filter(i=>net>=i&&flvl()>=NEEDL[i]);if(!a.length)return null;
      const i=pick(a),n=R(8,16);
      return{k:'fish',t:i,n,r:25+n*(4+4*i),x:n*12*(i+1)};
    },
    cook:()=>{const n=R(6,14);return{k:'cook',n,r:20+n*5,x:n*(8+Math.round(cklvl()*1.5))};},
    craft:()=>{const n=R(3,6);return{k:'craft',n,r:30+n*18,x:n*20};},
    smith:()=>{if(!(sxp>0))return null;const n=R(2,4);return{k:'smith',n,r:40+n*30,x:n*40};},
    fire:()=>{const n=R(5,10);return{k:'fire',n,r:20+n*6,x:n*20};}
  };
  const out=[];
  Object.keys(mk).sort(()=>Math.random()-0.5).forEach(k=>{if(out.length>=3)return;const t=mk[k]();if(t){t.h=0;t.c=0;out.push(t);}});
  return out;
}
// Makes a new set when 24 hours have passed. Returns 'new' if it replaced an old set, 'first' for the very first set, '' if nothing changed.
function tbCheck(){
  const now=nowMs(),el=now-tbGen;
  if(tbTasks.length&&el<TASK_MS&&el>-TASK_MS)return '';
  const had=tbTasks.length>0;
  tbTasks=tbMake();tbGen=now;if(saveOK)save();
  return had?'new':'first';
}
const tbLeft=()=>{const ms=Math.max(0,TASK_MS-(nowMs()-tbGen)),h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return h+'h '+m+'m';};
function taskEvt(kind,key){
  try{tutEvt(kind);}catch(e){}
  tbTasks.forEach(t=>{
    if(t.k!==kind||t.c||t.h>=t.n)return;
    if(t.t!==undefined&&t.t!==key)return;
    t.h++;
    if(t.h>=t.n&&scene)scene.time.delayedCall(700,()=>msg('Task complete: '+tbText(t)+'. Claim it at the Task Board.'));
  });
}

// Long talk text scrolls: show only the lines that fit (drag or mouse wheel)
function dlgRender(){
  dlgBody.setText(dlgFull);dlgHint.setText('');
  let wl=null;try{wl=dlgBody.getWrappedText(dlgFull);}catch(e){}
  if(!Array.isArray(wl)||!wl.length)return;
  const room=(DLG_H-46-dlgExtra*42)-6-dlgBody.y;
  let n=Math.max(1,Math.floor(room/(dlgBody.height/wl.length||20)));
  n=Math.min(n,wl.length);
  const show=()=>{dlgOff=Math.max(0,Math.min(Math.max(0,wl.length-n),dlgOff));dlgBody.setText(wl.slice(dlgOff,dlgOff+n).join('\n'));};
  show();
  for(let k=0;k<30&&n>1&&dlgBody.height>room;k++){n--;show();}
  if(wl.length>n)dlgHint.setText('drag or scroll '+(dlgOff+1)+'-'+(dlgOff+n)+'/'+wl.length);
}
function dlgShow(){
  const n=dlgNpc,say=n.say.length?n.say:['...'],last=dlgIdx>=say.length-1;
  {   // extra buttons above Next: Trade (if this person has a shop) and Quest (if they have one for you)

// An innkeeper fully heals you for a price
function npcHeal(n){
  if(!n||!n.heal)return;
  if(hp>=MAXHP){msg(n.name+': You look well rested already, friend. Save your coins.');return;}
  if(coins<n.heal){msg(n.name+': A bed is '+n.heal+' coins. Come back when you have them.');return;}
  coins-=n.heal;hp=MAXHP;
  dlg.setVisible(false);hpUi();ui();save();
  msg('You rest at the inn and wake fully healed. ('+n.heal+' coins)');
}
function npcGo(c,mode){
  const n=NPCS[c];if(!n)return;
  const path=bfs((x,y)=>Math.abs(x-n.x)+Math.abs(y-n.y)===1);
  if(!path){msg("You can't reach "+n.name+'.');return;}
  go(path,()=>{if(mode==='trade'&&(n.shop||n.bank))npcTrade(n);else if(mode==='heal'&&n.heal)npcHeal(n);else npcOpen(c);});
}
const ownedGear=()=>false;   // you can own as many of any item as you like, so the shop never refuses a purchase
function shopList(){return shTab===0?curShop.sell:curShop.buy;}
function shopScroll(d){shOff=Math.max(0,Math.min(shopList().length-SHVIS,shOff+d));ui();}
function shopRefresh(){
  if(!shRows.length)return;
  const L=shopList();
  shOff=Math.max(0,Math.min(Math.max(0,L.length-SHVIS),shOff));
  shTabs.forEach((t,i)=>t.setColor(shTab===i?'#ffe066':'#f1e9c8'));
  shRows.forEach((row,i)=>{
    const e=L[shOff+i];
    if(!e){row.bg.setVisible(false);row.ic.setVisible(false);row.t.setVisible(false);return;}
    const [id,pr]=e;
    row.bg.setVisible(true);row.ic.setVisible(true).setTexture(icon(id));row.t.setVisible(true);
    if(shTab===0){
      const own=ownedGear(id);
      row.t.setText(cap(nm(id))+'\n'+(own?'You own this or better':pr+' coins')).setColor(!own&&coins>=pr?'#f1e9c8':'#8a8472');
    }else{
      const n=cnt(id);
      row.t.setText(cap(nm(id))+'  x'+n+'\n'+pr+' each'+(n?' = '+n*pr+' coins':'')).setColor(n>0?'#f1e9c8':'#8a8472');
    }
  });
  if(shBar){const n=L.length,tk=SHVIS*SHROW-4,th=Math.max(14,tk*Math.min(1,SHVIS/Math.max(1,n)));shBar.setSize(5,th).setPosition(SW0-11,SHY0+(n>SHVIS?(tk-th)*shOff/(n-SHVIS):0)).setVisible(n>SHVIS);if(shTrack)shTrack.setVisible(n>SHVIS);}
}
const SW0=360;
function shopBuy(i){
  const e=curShop.sell[i];if(!e)return;
  const [id,pr]=e;
  if(ownedGear(id)){msg('You already own that or something better.');return;}
  if(coins<pr){msg('You need '+pr+' coins for the '+nm(id)+'.');return;}
  if(!canAdd(id)){msg('Your bag is full.');return;}
  coins-=pr;addItem(id,1);   // addItem keeps seeds, scrolls and bones in one counted stack
  msg('You buy the '+nm(id)+'.'+(isTool(id)?' Tap it in your bag to equip it.':''));
  ui();
}
function shopSell(i){
  const e=curShop.buy[i];if(!e)return;
  const [id,pr]=e,n=cnt(id);
  if(!n){msg("You don't have any "+nm(id)+'.');return;}
  purge(id);
  coins+=n*pr;msg('You sell '+n+' '+nm(id)+' for '+n*pr+' coins.');ui();
}

function sell(k,price){
  const n=cnt(k);
  if(!n){msg("You don't have any to sell.");return;}
  purge(k);
  coins+=n*price;
  msg('You sell '+n+' for '+n*price+' coins.');
  ui();
}

  const c=(typeof MONCFG==='object'&&MONCFG&&MONCFG[k])||{},t=MT[k],L=Math.floor(+c.level);
  if(L>=1&&L<=200&&L!==monLvl(t)){const f=L/monLvl(t);t.hp=Math.max(1,Math.round(t.hp*f));t.dmg=[Math.round(t.dmg[0]*f),Math.round(t.dmg[1]*f)];if(t.dmg[1]<t.dmg[0])t.dmg[1]=t.dmg[0];t.xp=Math.max(1,Math.round(t.xp*f));t.lv=L;}
  if(t.person){   // people: can be talked to and/or attacked, as chosen in the editor
    t.talk=c.talk===undefined?!!t.talkDef:!!+c.talk;t.fight=c.fight===undefined?!!t.fightDef:!!+c.fight;
    if(!t.talk&&!t.fight)t.talk=true;
    if(!t.fight){t.passive=1;t.dmg=[0,0];}
  }
  t.aggro=!t.passive&&(c.aggro===undefined?!!t.aggroDef:!!+c.aggro);
}

// ---- Boss rules: plain numbers in, plain events out (no drawing), so the same code can run on the server later ----
const BOSS={slamEvery:7000,windup:1600,slamDmg:[8,14],slamReach:2,enrageAt:0.4,enrageMul:1.3,sight:6};
const bossNew=()=>({next:0,wind:0,enr:false});
// s = boss state, now = ms clock, hp/max = boss health, dist = tiles to the nearest player. Returns a list of events.
function bossRule(s,now,hp,max,dist){
  const out=[],en=max>0&&hp/max<=BOSS.enrageAt;
  if(en&&!s.enr)out.push({k:'enrage'});
  s.enr=en;
  if(s.wind){if(now>=s.wind){s.wind=0;s.next=now+BOSS.slamEvery/(en?1.5:1);out.push({k:'slam'});}}
  else if(dist<=BOSS.sight&&now>=s.next){s.wind=now+BOSS.windup;out.push({k:'warn'});}
  return out;
}
const monHit=m=>Math.max(1,Math.round(Phaser.Math.Between(m.t.dmg[0],m.t.dmg[1])*((m.bs&&m.bs.enr)?BOSS.enrageMul:1)));
// what a boss attack looks like and does to YOU; when playing together the host decides the attack and every player runs this
function bossEvent(m,ev){
  if(ev.k==='enrage'){m.c.list[0].setTint(0xff8080);if(Math.abs(m.x-px)+Math.abs(m.y-py)<=BOSS.sight+6)msg('The '+m.t.name+' roars and grows enraged!');}
  else if(ev.k==='warn'){
    if(m.slam)m.slam.z.forEach(z=>z.destroy());
    const cx=Number.isInteger(ev.x)?ev.x:m.x,cy=Number.isInteger(ev.y)?ev.y:m.y;
    m.slam={x:cx,y:cy,z:[]};
    for(let dx=-BOSS.slamReach;dx<=BOSS.slamReach;dx++)for(let dy=-BOSS.slamReach;dy<=BOSS.slamReach;dy++){
      if(Math.abs(dx)+Math.abs(dy)>BOSS.slamReach)continue;
      m.slam.z.push(scene.add.rectangle((cx+dx)*T+T/2,(cy+dy)*T+T/2+OY,T-2,T-2,0xff2020,0.35).setDepth(darkHere()?392:5));
    }
    pop(m.c.x,m.c.y-34,'!','#ff4040');
    if(Math.abs(cx-px)+Math.abs(cy-py)<=BOSS.sight+6)msg(m.t.tex==='deepwarden'?'The Deepwarden lifts its crystal fists! Step away!':'The '+m.t.name+' raises its hammer! Step away!');
  }else if(ev.k==='slam'&&m.slam){
    const sl=m.slam;m.slam=null;sl.z.forEach(z=>z.destroy());
    if(Math.abs(px-sl.x)+Math.abs(py-sl.y)>BOSS.sight+6)return;      // too far away to feel it
    scene.cameras.main.shake(160,0.006);
    if(Math.abs(px-sl.x)+Math.abs(py-sl.y)<=BOSS.slamReach){
      const e=Math.max(1,Phaser.Math.Between(BOSS.slamDmg[0],BOSS.slamDmg[1])-Math.floor(def()/2));
      hp-=e;dxp+=e;pop(player.x,player.y-14,'-'+e,'#ff6b6b');
      if(hp<=0){
        stopChop();deathPenalty();hp=MAXHP;if(!smFollower()&&!m.t.world){m.hp=m.t.hp;barUp(m);}m.hunt=false;mons.forEach(q=>{q.prov=0;q.hunt=false;});
        px=START.x;py=START.y;walkId++;scene.tweens.killTweensOf(player);player.setPosition(px*T+T/2,py*T+T/2+OY);
        msg('You were knocked out! You wake up at the start.'+deathNote);
      }
      ui();
    }else pop(player.x,player.y-14,'dodged','#cccccc');
  }
}
function bossTick(){
  if(!player)return;
  if(smFollower())return;          // the host runs the bosses and tells us about each attack
  const now=Date.now(),others=smPlayers();
  mons.forEach(m=>{
    if(!m.t.boss||!m.alive)return;
    // a boss goes for whoever is closest, you or another player
    let dist=hp>0?Math.abs(m.x-px)+Math.abs(m.y-py):1e9;
    others.forEach(o=>{dist=Math.min(dist,Math.abs(m.x-o.x)+Math.abs(m.y-o.y));});
    const b=m.bs||(m.bs=bossNew());
    bossRule(b,now,m.hp,m.t.hp,dist).forEach(ev=>{
      if(ev.k==='warn'){ev.x=m.x;ev.y=m.y;}
      bossEvent(m,ev);
      smBossShare(m,ev);
    });
  });
}

// aggressive monsters that are well above your level notice you, chase you and strike first
const PROV_MS=10000,PROV_RANGE=14;   // how long a hurt monster stays aggressive, and how far it will chase
// one blow from a monster against you (shared by the normal and the multiplayer paths)
function monStrike(m,now){
  if(now-(m.lastHit||0)<1200)return;
  m.lastHit=now;
  if(!fightMon)stopChop();
  const before=snap();dxp+=2;
  scene.tweens.add({targets:m.c,x:m.c.x+(px-m.x)*5,y:m.c.y+(py-m.y)*5,duration:90,yoyo:true});
  if(Math.random()<hitChance(m.t)){
    const e=monHit(m);hp-=e;dxp+=e;pop(player.x,player.y-14,'-'+e,'#ff6b6b');
    if(hp<=0){
      stopChop();deathPenalty();hp=MAXHP;if(!smFollower()&&!m.t.world){m.hp=m.t.hp;barUp(m);}m.hunt=false;mons.forEach(q=>{q.prov=0;q.hunt=false;});
      px=START.x;py=START.y;walkId++;scene.tweens.killTweensOf(player);player.setPosition(px*T+T/2,py*T+T/2+OY);
      msg('You were knocked out! You wake up at the start.'+deathNote);
    }
  }else pop(player.x,player.y-14,'miss','#cccccc');
  {const lu=lvlUp(before);if(lu)msg(lu);}
  ui();
}
function aggroTick(){
  if(!player||hp<=0)return;
  const me=clvl(),now=Date.now();
  // playing together but someone else runs the monsters: they only move as the host says; we just take their blows
  if(smFollower()){
    mons.forEach(m=>{
      if(!m.alive||m.busy||m.t.passive||!m.huntMe)return;
      if(Math.abs(m.x-px)+Math.abs(m.y-py)<=1)monStrike(m,now);
    });
    return;
  }
  const others=smPlayers();   // the other players this game runs monsters for (empty when playing alone)
  mons.forEach(m=>{
    if(!m.alive||m.busy||m.t.passive||(m.busyT||0)>now)return;
    const prov=(m.prov||0)>now;   // someone hurt it: it stays angry and keeps chasing them for 10 seconds after the last hit
    if(!prov&&!m.t.aggro){m.hunt=false;m.huntIdx=0;return;}
    // who is it after? you, or (when playing together) another player
    let tx=px,ty=py,mine=true,idx=1;
    if(others.length){
      const cand=[{x:px,y:py,lv:me,id:MP.id,me:1,k:1}].concat(others);
      let best=null,bd=1e9;
      cand.forEach(p=>{
        const d=Math.abs(m.x-p.x)+Math.abs(m.y-p.y);
        if(prov){if(m.provBy&&m.provBy!==p.id&&!(p.me&&m.provBy==='me'))return;if(d>PROV_RANGE)return;}
        else if(monLvl(m.t)<p.lv+AGGRO_GAP||d>AGGRO_RANGE)return;
        if(d<bd){bd=d;best=p;}
      });
      if(!best){m.hunt=false;m.huntIdx=0;return;}
      tx=best.x;ty=best.y;mine=!!best.me;idx=best.k;
    }
    const d=Math.abs(m.x-tx)+Math.abs(m.y-ty);
    if(mine&&(prov?d>PROV_RANGE:(monLvl(m.t)<me+AGGRO_GAP||d>AGGRO_RANGE))){m.hunt=false;m.huntIdx=0;return;}
    if(!m.hunt&&mine)msg('The '+m.t.name+(prov?' is coming for you!':' notices you!'));
    m.hunt=true;m.huntIdx=idx;
    if(d>1){
      const opts=DIRS.map(([dx,dy])=>[m.x+dx,m.y+dy]).filter(([nx,ny])=>nx>=0&&ny>=0&&nx<MW&&ny<MH&&(grid[ny][nx]==='.'||(m.t.amph&&grid[ny][nx]==='~'))&&!(nx===tx&&ny===ty)&&!(nx===px&&ny===py)&&!monAt(nx,ny)&&Math.abs(nx-m.hx)<=(prov?14:8)&&Math.abs(ny-m.hy)<=(prov?14:8)).map(([nx,ny])=>[nx,ny,Math.abs(nx-tx)+Math.abs(ny-ty)]).filter(o=>o[2]<d).sort((a,b)=>a[2]-b[2]);
      if(opts.length){const [nx,ny]=opts[0];m.x=nx;m.y=ny;scene.tweens.add({targets:m.c,x:nx*T+T/2,y:ny*T+T/2+OY,duration:350});}
      return;
    }
    if(mine)monStrike(m,now);      // another player's game handles the blows against them
  });
}

function wander(){
  if(smFollower())return;
  const now=Date.now();
  mons.forEach(m=>{
    if(!m.alive||m.busy||m.hunt||(m.busyT||0)>now||Math.random()<(m.t.person?0.3:0.5))return;
    const [dx,dy]=DIRS[Phaser.Math.Between(0,3)],nx=m.x+dx,ny=m.y+dy;
    if(nx<0||ny<0||nx>=MW||ny>=MH||!(grid[ny][nx]==='.'||(m.t.amph&&grid[ny][nx]==='~')))return;   // amphibious people can also paddle through water
    const WR=m.t.person?4:5;   // townsfolk stay within 4 tiles of where they spawned
    if(Math.abs(nx-m.hx)>WR||Math.abs(ny-m.hy)>WR||(nx===px&&ny===py)||monAt(nx,ny))return;
    m.x=nx;m.y=ny;
    scene.tweens.add({targets:m.c,x:nx*T+T/2,y:ny*T+T/2+OY,duration:350});
  });
}

// a speech bubble above someone's head: wraps onto lines, stays long enough to read, follows them and stays on screen
function bubble(m,text,col){
  if(m.say){try{m.say.t.destroy();m.say.tw.stop();}catch(e){}m.say=null;}
  const t=scene.add.text(m.c.x,m.c.y-30,text,{fontFamily:'ui-monospace, Menlo, Consolas, monospace',fontSize:'14px',color:col||'#ffffff',backgroundColor:'rgba(0,0,0,0.72)',padding:{x:6,y:4},align:'center',wordWrap:{width:180,useAdvancedWrap:true}}).setOrigin(0.5,1).setResolution(2).setDepth(900);
  const hold=Math.min(7000,2200+text.length*70);   // longer lines stay up longer
  const place=()=>{
    const cam=scene.cameras.main,v=cam.worldView,w=t.width/2+4;
    let x=m.c.x,y=m.c.y-30;
    if(v&&v.width){x=Math.max(v.x+w,Math.min(v.right-w,x));y=Math.max(v.y+t.height+4,Math.min(v.bottom-4,y));}
    t.setPosition(x,y);
  };
  place();
  const rec={t,tw:null};
  rec.tw=scene.tweens.addCounter({from:0,to:1,duration:hold+500,onUpdate:tw=>{if(!t.scene)return;place();const e=tw.getValue()*(hold+500);t.setAlpha(e<hold?1:Math.max(0,1-(e-hold)/500));},onComplete:()=>{try{t.destroy();}catch(e){}if(m.say===rec)m.say=null;}});
  m.say=rec;
}
function talkTo(m){

  if(dd(px,py)<=2){done();return;}
  const path=bfs((x,y)=>dd(x,y)===1);
  if(!path){msg('You cannot reach the '+m.t.name+'.');return;}

// Long guide text scrolls: show only the lines that fit (drag or mouse wheel)
function gdRender(){
  gdBody.setText(gdFull);
  let wl=null;try{wl=gdBody.getWrappedText(gdFull);}catch(e){}
  if(!Array.isArray(wl)||!wl.length){gdHint.setText('Tap X to go back.');return;}
  const room=440-48-gdBody.y;   // the box is 440 tall; the hint takes the bottom strip
  let n=Math.max(1,Math.floor(room/(gdBody.height/wl.length||22)));
  n=Math.min(n,wl.length);
  // shrink until what is shown really fits inside the box
  const show=()=>{gdOff=Math.max(0,Math.min(Math.max(0,wl.length-n),gdOff));gdBody.setText(wl.slice(gdOff,gdOff+n).join('\n'));};
  show();
  for(let g=0;g<30&&n>1&&gdBody.height>room;g++){n--;show();}
  const mx=Math.max(0,wl.length-n);
  gdHint.setText(mx>0?'Drag or scroll for more ('+(gdOff+1)+'-'+(gdOff+n)+' of '+wl.length+')\nTap X to go back.':'Tap X to go back.');
}

function fletch(i){

function fireAt(x,y){return fires.some(f=>f.x===x&&f.y===y);}
function lightFire(id){

const cookChance=ti=>Math.min(0.95,0.55+0.05*(cklvl()-NEEDC[ti]+1));
function startCook(fx,fy,rg){
  const can=()=>inv.findIndex(o=>RAW.includes(o)&&cklvl()>=NEEDC[RAW.indexOf(o)]);
  if(!inv.some(o=>RAW.includes(o))){msg('You have nothing raw to cook. Try raw fish, chicken, beef or monster meat.');return;}
  if(can()<0){msg('You need a higher Cooking level for that.');return;}
  msg(rg?'You cook on the range...':'You cook on the fire...');
  chopEvt=scene.time.addEvent({delay:1300*(1-gspeed()),loop:true,callback:()=>{
    if(!rg&&!fireAt(fx,fy)){stopChop();msg('The fire has burned out.');return;}
    const i=can();
    if(i<0){stopChop();return;}
    const ti=RAW.indexOf(inv[i]),before=cklvl();
    if(Math.random()<Math.min(0.98,cookChance(ti)+(rg?0.15:0))){inv[i]=COOKED[ti];ckxp+=CKXP[ti];taskEvt('cook');msg(cklvl()>before?'Level up! Cooking is now '+cklvl()+'.':'You cook a '+nm(COOKED[ti]).replace('cooked ','')+'.');}
    else{inv.splice(i,1);ckxp+=Math.floor(CKXP[ti]/4);msg('You burn the '+nm(RAW[ti]).replace('raw ','')+'.');}
    ui();
  }});
}
const fmtDur=s=>s<90?s+' seconds':Math.ceil(s/60)+' minutes';
function farmStage(f){const e=(Date.now()-f[1])/1000,g=FRGROW[f[0]];return e>=g?3:e>=g*0.6?2:1;}
function farmLeft(f){return Math.max(0,Math.ceil(FRGROW[f[0]]-(Date.now()-f[1])/1000));}
function farmVis(){for(const k in patchSpr){const f=farm[k],t=!f?'patch0':farmStage(f)===3?'patchr'+f[0]:'patch'+farmStage(f);if(patchTx[k]!==t){patchTx[k]=t;patchSpr[k].setTexture(t);}}}
function farmAct(tx,ty,want){
  const k=tx+','+ty,f=farm[k];
  if(f){
    const t=f[0];
    if(farmStage(f)<3){msg('The '+CROPP[t]+' are still growing ('+fmtDur(farmLeft(f))+' left).');return;}
    if(!canAdd(CROPS[t])){msg('Your bag is full. Tap an item in your bag to drop it.');return;}
    const before=frlvl(),n=3+Phaser.Math.Between(0,2)+Math.floor(frlvl()/12);
    let extra='',dropped=0;
    for(let q=0;q<n;q++)if(!addItem(CROPS[t])){dropAt(px,py,CROPS[t],1);dropped++;}   // crops take one slot each; any that don't fit land at your feet
    frxp+=FRXP[t];
    if(dropped)extra=' Your bag is full, so '+dropped+' '+(dropped>1?CROPP[t]:CROPN[t])+' fell on the ground.';
    if(Math.random()<0.3&&canAdd(SEEDS[t])){addItem(SEEDS[t],1);extra+=' You save a seed.';}
    delete farm[k];farmVis();
    msg(frlvl()>before?'Level up! Farming is now '+frlvl()+'.'+extra:'You harvest '+n+' '+(n>1?CROPP[t]:CROPN[t])+'.'+extra);
    ui();save();return;
  }
  let t=-1;
  if(want!==undefined&&want>=0)t=want;
  else for(const q of SEEDS.map((_,i)=>i).sort((a,b)=>FRNEED[b]-FRNEED[a]))if(cnt(SEEDS[q])>0&&frlvl()>=FRNEED[q]){t=q;break;}
  if(t<0){
    const low=SEEDS.findIndex(s=>cnt(s)>0);
    msg(low>=0?'You need Farming '+FRNEED[low]+' to plant '+nm(SEEDS[low])+'s.':'You need seeds to plant. The shopkeeper sells them.');return;
  }
  if(cnt(SEEDS[t])<1){msg('You have no '+nm(SEEDS[t])+'s.');return;}
  if(frlvl()<FRNEED[t]){msg('You need Farming '+FRNEED[t]+' to plant '+nm(SEEDS[t])+'s.');return;}
  const before=frlvl();
  takeOne(inv.indexOf(SEEDS[t]));
  farm[k]=[t,Date.now()];frxp+=Math.round(FRXP[t]/4);farmVis();
  msg(frlvl()>before?'Level up! Farming is now '+frlvl()+'.':'You plant a '+nm(SEEDS[t])+'. It will be ready in about '+fmtDur(FRGROW[t])+'.');
  ui();save();
}
function prepDish(k){
  const [ud,need]=DISHES[k],ti=RAW.indexOf(ud),ks=Object.keys(need);

function eat(i){
  const ci=CROPS.indexOf(inv[i]);

// Clicking a world tile does its main action (walk, chop, mine, fish, talk, attack...)
// Book stands: the text splits into pages (a line with --- starts a new page) and long pages are cut to fit the box
function bookPages(text,obj,roomH){
  obj=obj||dlgBody;
  text=String(text||'').replace(/^#+[ \t]*/gm,'').replace(/\*\*([^*]+)\*\*/g,'$1').replace(/\*([^*\n]+)\*/g,'$1');
  const raw=text.split(/\n\s*-{3,}\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(!raw.length)return ['The pages are blank.'];
  obj.setText('A');const h1=obj.height;obj.setText('A\nA');const pitch=Math.max(1,obj.height-h1);
  const room=roomH||(DLG_H-46-6-dlgBody.y),n=Math.max(1,Math.floor((room-h1)/pitch)+1);
  const out=[];
  raw.forEach(pg=>{
    let wl=null;try{wl=obj.getWrappedText(pg);}catch(e){}
    if(!Array.isArray(wl)||!wl.length){out.push(pg);return;}
    for(let i=0;i<wl.length;i+=n){const c=wl.slice(i,i+n).join('\n').trim();if(c)out.push(c);}
  });
  return out.length?out:['The pages are blank.'];
}

function tileAct(tx,ty){

    const path=bfs((x,y)=>Math.abs(x-tx)+Math.abs(y-ty)===1);

// ===== Accounts (only when the game is opened from the Oakheart server) =====
// The server marks its page with window.OAK_SERVER. Then you log in, your progress and character come from your
// account, and every save is sent back to the server (and on any device you log in from, it comes back).
const AUTHKEY='oakheart-auth';
const OAK={on:!!window.OAK_SERVER,token:null,user:null,dirty:false,last:'',timer:null};
try{const a=JSON.parse(localStorage.getItem(AUTHKEY)||'null');if(a&&typeof a.token==='string'){OAK.token=a.token;OAK.user=String(a.username||'');}}catch(e){}
function oakPayload(){let s=null,c=null;try{s=localStorage.getItem(KEY);c=localStorage.getItem(CHKEY);}catch(e){}return {save:s,char:c};}
function oakUpload(now){   // send the save to the server (not more than every few seconds)
  if(!OAK.on||!OAK.token)return;
  const p=oakPayload(),j=JSON.stringify(p);if(j===OAK.last&&!now)return;
  clearTimeout(OAK.timer);
  const go=()=>{OAK.timer=null;const body=JSON.stringify(Object.assign({token:OAK.token},oakPayload()));
    fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:body.length<60000}).then(r=>{if(r.ok)OAK.last=j;else if(r.status===401)oakLogout(true);else if(r.status===409)r.json().then(d=>oakRefused(d&&d.error)).catch(()=>{});}).catch(()=>{});};
  if(now)go();else OAK.timer=setTimeout(go,4000);
}
let oakRefT=0;
function oakRefused(why){   // the server's cheat check turned this save down: tell the player (not more than once a minute)
  if(Date.now()-oakRefT<60000)return;oakRefT=Date.now();
  const t=(why||'The server refused this save.')+' Progress since your last good save will not be kept.';
  try{msg(t);if(MP.chatAdd)MP.chatAdd('',t,0,true);}catch(e){}
}
function oakBeacon(){   // the page is closing: a last save that still gets through
  if(!OAK.on||!OAK.token)return;
  try{if(saveOK)save();}catch(e){}   // put the very latest progress in first
  const p=oakPayload();if(!p.save&&!p.char)return;   // never send an empty save by accidentif(JSON.stringify(p)===OAK.last)return;
  try{navigator.sendBeacon('/api/save',new Blob([JSON.stringify(Object.assign({token:OAK.token},p))],{type:'application/json'}));}catch(e){}
}
function oakLogout(expired){
  try{if(!expired)oakBeacon();}catch(e){}
  saveOK=false;OAK.token=null;   // logged out: nothing more is sent for this account
  try{localStorage.removeItem(AUTHKEY);localStorage.removeItem(KEY);localStorage.removeItem(CHKEY);}catch(e){}
  if(expired)alert('Please log in again.');
  location.reload();
}
if(OAK.on){
  addEventListener('pagehide',oakBeacon);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')oakBeacon();});
  if(OAK.token)fetch('/api/me',{headers:{Authorization:'Bearer '+OAK.token}}).then(r=>{if(r.status===401)oakLogout(true);}).catch(()=>{});
}
// The shared room, over the Oakheart server: the same shape as the room inside Claude, so trading, duels,
// shared monsters and everything else work the same way.
function oakRoom(){
  return new Promise(done=>{
    const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?t='+encodeURIComponent(OAK.token);
    const peers=new Map(),cbs=[],mine={};let ws=null,me=null,ready=false,pend={},sendT=null,closed=false;
    const view=p=>({peer:p.peer,kind:'viewer',sameTab:p.peer===me,presence:p.presence});
    const snap=()=>[...peers.values()].map(view);
    const tell=(j,u,l)=>{const ch={peers:snap(),joined:j,updated:u,left:l};cbs.forEach(f=>{try{f(ch);}catch(e){}});};
    const flush=()=>{sendT=null;if(ws&&ws.readyState===1&&Object.keys(pend).length){ws.send(JSON.stringify({t:'p',patch:pend}));pend={};}};
    const api={
      presence(patch){Object.assign(mine,patch);Object.assign(pend,patch);if(me&&peers.get(me))peers.get(me).presence=Object.assign({},mine);if(!sendT)sendT=setTimeout(flush,40);return Promise.resolve();},
      onPeers(cb){cbs.push(cb);if(ready)cb({peers:snap(),joined:snap().filter(p=>!p.sameTab),updated:[],left:[]});}
    };
    const connect=()=>{
      ws=new WebSocket(url);
      ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}
        if(m.t==='hello'){
          me=m.me;peers.clear();peers.set(me,{peer:me,presence:Object.assign({},mine)});
          (m.peers||[]).forEach(p=>peers.set(p.peer,{peer:p.peer,presence:p.presence||{}}));
          if(Object.keys(mine).length){pend=Object.assign({},mine);flush();}
          if(!ready){ready=true;done(api);}
          tell(snap().filter(p=>!p.sameTab),[],[]);
        }else if(m.t==='j'||m.t==='u'){
          const had=peers.has(m.peer);peers.set(m.peer,{peer:m.peer,presence:m.presence||{}});const v=view(peers.get(m.peer));
          tell(had?[]:[v],had?[v]:[],[]);
        }else if(m.t==='l'){const p=peers.get(m.peer);if(p){peers.delete(m.peer);tell([],[],[view(p)]);}}
        else if(m.t==='bye'){closed=true;msg(m.why||'Disconnected from the server.');if(/log in again/i.test(m.why||''))oakLogout(true);}
      };
      ws.onclose=()=>{
        const gone=[...peers.values()].filter(p=>p.peer!==me).map(view);[...peers.keys()].forEach(k=>{if(k!==me)peers.delete(k);});
        if(gone.length)tell([],[],gone);
        if(!closed)setTimeout(connect,3000);   // try again in a moment
      };
    };
    connect();
    setTimeout(()=>{if(!ready)done(null);},10000);
  });
}

// a one-pixel dark outline around everything drawn on a canvas (keeps the outline off the edges of a 32x32 tile)

    for(let y=0;y<h;y++)for(let q=0;q<w;q++){const i=y*w+q;if(a(i))continue;
      if((q>0&&a(i-1))||(q<w-1&&a(i+1))||(y>0&&a(i-w))||(y<h-1&&a(i+w)))out.push(i);}
    const c=col===undefined?0x1c140e:col;

// the edge pieces for one tile: grass over a path's sides, foam along a shore
function groundEdges(sc,x,y,cx,cy){
  try{
    const reg=b=>b<WH?0:1,inb=(a,b)=>a>=0&&b>=0&&a<MW&&b<MH&&reg(b)===reg(y);
    const isWater=(a,b)=>{const c=grid[b][a];return c==='~'||c in FISHC;};
    const isGrass=(a,b)=>{const c=grid[b][a];return !isWater(a,b)&&!WALLT[c]&&c!=='P'&&!FLOOR[b*MW+a];};
    const D=[[0,-1],[1,0],[0,1],[-1,0]],C=[[-1,-1],[1,-1],[1,1],[-1,1]];
    let test=null,side=null,corner=null;
    if(isWater(x,y)){test=(a,b)=>!isWater(a,b);side='shr';corner='shc';}
    else if(FRINGE_FL.has(FLOOR[y*MW+x])){test=isGrass;side='gfr';corner='gfc';}
    if(!test)return;
    const hit=D.map(([dx,dy])=>inb(x+dx,y+dy)&&test(x+dx,y+dy));
    hit.forEach((h,s)=>{if(h)sc.add.image(cx,cy,side+s);});
    C.forEach(([dx,dy],s)=>{// a corner piece only where both sides next to it are clear
      if(!hit[s===0?0:s===1?0:2]&&!hit[s===0||s===3?3:1]&&inb(x+dx,y+dy)&&test(x+dx,y+dy))sc.add.image(cx,cy,corner+s);});
  }catch(e){}
}

// ---- Playing together inside Claude: everyone who has this game open at the same time shares a live "room".
// Each player's spot, looks and last chat line travel as their room "presence"; nothing is stored, and each
// player's progress still saves on their own device. If a game server address is set, that is used instead.
const RM={room:null,tried:false,sayN:0,seen:new Map(),started:false};
const rmInt=(v,lo,hi,d)=>Number.isInteger(v)&&v>=lo&&v<=hi?v:d;
const rmApp=a=>{a=a&&typeof a==='object'?a:{};return{skin:rmInt(a.skin,0,20,1),hs:rmInt(a.hs,0,40,0),hc:rmInt(a.hc,0,40,0),shirt:rmInt(a.shirt,0,40,0),pants:rmInt(a.pants,0,40,0)};};
const rmGear=g=>{const o={};if(g&&typeof g==='object')['hd','bd','hn','ft','wp','wt','sh','bw','bk','cp','axe','net','pik'].forEach(k=>{o[k]=rmInt(g[k],-1,99,-1);});if(o.wt<0)o.wt=0;return o;};
const rmName=p=>String((p.presence&&p.presence.n)||'Player').replace(/[\u0000-\u001f]/g,'').slice(0,14)||'Player';
// ---- Shared monsters. One player's game (the "host") runs every monster: where it walks, its health, who it chases,
// when it dies and comes back. The host shares that in its room presence a few times a second; everyone else's game
// shows it. Hits from other players are reported in their presence, and the host takes them off. When the host leaves,
// the next player takes over. Later a real game server can do the host's job instead.
const SM={busy:new Map(),host:true,hostPeer:null,seq:0,hitSeq:0,myHits:[],lastHit:new Map(),pend:new Map(),pl:[],lv:new Map(),fx:-1};
const MV=()=>mons.length+'.'+MW;
const smShared=()=>!!(RM.room&&MP.others.size);
const smFollower=()=>!!(RM.room&&!SM.host&&SM.hostPeer&&MP.others.size);
function smPlayers(){   // the other players, for the host's monsters to chase: [{x,y,lv,id,k}]
  if(!RM.room||!SM.host)return [];
  const out=[];let k=2;SM.pl=[MP.id];
  MP.others.forEach(o=>{SM.pl.push(o.id);out.push({x:o.x,y:o.y,lv:SM.lv.get(o.id)||3,id:o.id,k:k++});});
  return out;
}
function monRespawn(m,soon){
  if(m.t.hw&&!hwOn()){m.rspT=false;return;}   // ghosts stay away once Halloween is over
  if(m.t.world){m.rspT=false;wbDied(m);return;}   // the world boss only rises on its own schedule
  if(smFollower()){m.rspT=false;return;}     // the host brings it back and tells us
  m.rspT=true;
  scene.time.delayedCall(soon?Math.min(5000,m.t.resp):m.t.resp,()=>{m.rspT=false;if(m.alive)return;m.dmgBy=null;m.myDmg=0;m.x=m.hx;m.y=m.hy;m.hp=m.t.hp;m.prov=0;m.alive=true;m.busy=false;m.c.setPosition(m.x*T+T/2,m.y*T+T/2+OY).setVisible(true);barUp(m);});
}

// ===== Trading between players =====
// Each player lists what they offer in their room presence ("tr"). Both games show the two offers. When both press
// Accept, a second screen shows exactly what changes hands, and both press Confirm. Changing an offer clears both
// accepts. The swap happens only when both games have confirmed the very same pair of offers; each game then
// swaps the items on its own side.
const TR={mode:'trade',peer:null,st:null,o:{},c:0,h:'',ask:0,seen:new Map(),names:new Map(),at:new Map(),asked:new Map(),ui:null,amt:null,ic:{},note:''};
const trNoTrade=id=>/^qi\d$/.test(id);
const trName=p=>(MP.others.get(p)||{}).name||TR.names.get(p)||'The other player';
const trHave=id=>STACKS.test(id)?(inv.includes(id)?stackN(id):0):inv.filter(i=>i===id).length;
const trOff=(o,c)=>Object.keys(o).sort().map(k=>k+'*'+o[k]).join(',')+'|'+c;
function trHash(){const p=TR.seen.get(TR.peer);if(!p)return '';const a=trOff(TR.o,TR.c),b=trOff(p.o,p.c);return (TR.mode==='duel'?'D:':'')+(MP.id<TR.peer?a+'/'+b:b+'/'+a);}
function trPub(){
  if(!RM.room)return;
  const v=TR.peer?{to:TR.peer,st:TR.st,m:TR.mode==='duel'?1:0,o:Object.keys(TR.o).slice(0,28).map(k=>[k,TR.o[k]]),c:TR.c,h:TR.h}:null;
  if(v&&DU&&DU.peer===TR.peer){v.hp=Math.max(0,hp|0);v.mx=MAXHP|0;v.dd=def()|0;v.dh=DU.hits.slice(-20);}   // during a duel: your health, defense and your blows
  try{RM.room.presence({tr:v}).catch(()=>{});}catch(e){}
}
function trClean(t){   // the other player's trade state, checked before we use any of it
  if(!t||typeof t!=='object'||typeof t.to!=='string'||!['ask','open','acc','conf','done','fight','won','lost'].includes(t.st))return null;
  const o={};let bad=false;
  (Array.isArray(t.o)?t.o:[]).slice(0,28).forEach(e=>{
    if(!Array.isArray(e)||!goodId(e[0])||e[0]==='coin'||trNoTrade(e[0])||!Number.isInteger(e[1])||e[1]<1){bad=true;return;}
    o[e[0]]=Math.min(STACKS.test(e[0])?99999:28,(o[e[0]]||0)+e[1]);
  });
  if(bad)return null;
  const n=(v,lo,hi,d)=>Number.isInteger(v)&&v>=lo&&v<=hi?v:d;
  const dh=(Array.isArray(t.dh)?t.dh:[]).filter(e=>Array.isArray(e)&&Number.isInteger(e[0])&&Number.isInteger(e[1])&&e[1]>=0&&e[1]<=60).slice(-20);
  return {to:t.to,st:t.st,m:t.m===1?'duel':'trade',o,c:Number.isInteger(t.c)&&t.c>=0&&t.c<=1e9?t.c:0,h:typeof t.h==='string'?t.h.slice(0,4000):'',hp:n(t.hp,0,9999,0),mx:n(t.mx,1,9999,1),dd:n(t.dd,0,500,0),dh};
}
function trValid(){for(const k in TR.o)if(trHave(k)<TR.o[k])return false;return TR.c>=0&&TR.c<=coins;}
function trRoom(){     // would everything fit in your bag after the swap?
  const p=TR.seen.get(TR.peer);if(!p)return false;
  if(TR.mode==='duel')return true;   // duel winnings that don't fit go to your bank
  const nc=coins-TR.c+p.c,left=inv.slice(),drop=k=>{const i=left.indexOf(k);if(i>=0)left.splice(i,1);};
  for(const k in TR.o){if(STACKS.test(k)){if(TR.o[k]>=trHave(k))drop(k);}else for(let n=0;n<TR.o[k];n++)drop(k);}
  for(const k in p.o){if(STACKS.test(k)){if(!left.includes(k))left.push(k);}else for(let n=0;n<p.o[k];n++)left.push(k);}
  return left.length<=CAPMAX-(nc>0?1:0);
}
const trList=(o,c)=>{const a=Object.keys(o).map(k=>(o[k]>1?o[k]+' x ':'')+nm(k));if(c)a.push(c.toLocaleString()+' coin'+(c===1?'':'s'));return a.join(', ')||'nothing';};
function trSys(t){if(MP.chatAdd)MP.chatAdd('',t,0,true);}
function trEnd(why){
  const was=TR.peer;
  if(DU)duelStop(true);   // a duel that never finished gives your stake back
  TR.peer=null;TR.mode='trade';TR.st=null;TR.o={};TR.c=0;TR.h='';TR.amt=null;TR.note='';trPub();trDraw();
  if(why&&was){msg(why);trSys(why);}
}
function trAsk(peer,mode){
  if(!RM.room)return;
  mode=mode==='duel'?'duel':'trade';
  const o=MP.others.get(peer);if(!o){msg('That player has gone.');return;}
  const busy=TR.peer&&TR.st!=='done'&&TR.st!=='won'&&TR.st!=='lost';
  if(busy&&(TR.peer!==peer||TR.mode!==mode)){msg(TR.st==='fight'?'Finish your duel first.':'You are already '+(TR.mode==='duel'?'setting up a duel':'trading')+' with '+trName(TR.peer)+'.');return;}
  if(busy)return;
  if(curD>=0){msg('You cannot '+(mode==='duel'?'duel':'trade')+' down here.');return;}
  if(Math.abs(o.x-px)+Math.abs(o.y-py)>8){msg('Get closer to '+o.name+' to '+(mode==='duel'?'duel':'trade')+'.');return;}
  TR.mode=mode;TR.peer=peer;TR.st='ask';TR.ask=Date.now();TR.o={};TR.c=0;TR.h='';trPub();
  const p=TR.seen.get(peer);
  if(!(p&&p.to===MP.id&&p.st==='ask'&&p.m===mode))msg(mode==='duel'?'Challenging '+o.name+' to a duel...':'Sending a trade request to '+o.name+'...');
  trToast(null);trTick();
}
// the swap itself: both games have confirmed the same offers
function trSwap(){
  const p=TR.seen.get(TR.peer),who=trName(TR.peer);if(!p)return;
  if(!trValid()){trEnd('Something in your offer is gone, so the trade was cancelled.');return;}
  const gave=trList(TR.o,TR.c),got=trList(p.o,p.c);
  for(const k in TR.o){const n=TR.o[k];
    if(STACKS.test(k)){stk[k]=stackN(k)-n;if(stk[k]<=0){delete stk[k];const i=inv.indexOf(k);if(i>=0)inv.splice(i,1);}}
    else for(let i=0;i<n;i++){const j=inv.indexOf(k);if(j>=0)inv.splice(j,1);}
  }
  coins=coins-TR.c+p.c;
  for(const k in p.o){const n=p.o[k];
    if(STACKS.test(k)){if(!addItem(k,n))dropAt(px,py,k,n);}
    else for(let i=0;i<n;i++)if(!addItem(k))dropAt(px,py,k,1);
  }
  TR.st='done';TR.amt=null;trPub();
  const peer=TR.peer;
  setTimeout(()=>{if(TR.peer===peer&&TR.st==='done'){TR.peer=null;TR.st=null;TR.o={};TR.c=0;TR.h='';trPub();}},6000);
  const line='Trade with '+who+' complete. You gave '+gave+' and got '+got+'.';
  msg(line);trSys(line);save();ui();trDraw();
}
// works out what should happen next, every time either side changes something
function trTick(){
  if(!TR.peer||TR.st==='done'||TR.st==='won'||TR.st==='lost')return;
  if(TR.st==='fight'){duelTick();return;}
  const p=TR.seen.get(TR.peer),o=MP.others.get(TR.peer),toMe=p&&p.to===MP.id,word=TR.mode==='duel'?'duel':'trade';
  if(!o){trEnd(trName(TR.peer)+' has left, so the '+word+' was cancelled.');return;}
  if(TR.st==='ask'){
    if(toMe&&p.m===TR.mode&&(p.st==='ask'||p.st==='open')){TR.st='open';TR.o={};TR.c=0;TR.h='';trPub();msg(TR.mode==='duel'?'Duel with '+o.name+': put up stakes if you like, then both accept.':'Trading with '+o.name+'.');}
    else if(Date.now()-TR.ask>30000){trEnd(o.name+' did not answer your '+(TR.mode==='duel'?'duel challenge':'trade request')+'.');return;}
    trDraw();return;
  }
  // they finished first: it is agreed, so do our side too
  if(TR.st==='conf'&&toMe&&p.h===TR.h){
    if(TR.mode==='duel'&&(p.st==='conf'||p.st==='fight')){duelStart();return;}
    if(TR.mode!=='duel'&&(p.st==='conf'||p.st==='done')){trSwap();return;}
  }
  const at=TR.at.get(TR.peer)||[o.x,o.y];
  if(Math.abs(at[0]-px)+Math.abs(at[1]-py)>10){if(RM.room&&MP.sentPos!==px+','+py){MP.sentPos=px+','+py;try{RM.room.presence({x:px,y:py}).catch(()=>{});}catch(e){}}   // our new spot goes out first, so they see why
    trEnd('You and '+o.name+' are too far apart, so the '+word+' was cancelled.');return;}
  if(!toMe||p.st==='done'||p.m!==TR.mode){trEnd(o.name+' declined the '+word+'.');return;}
  if((TR.st==='acc'||TR.st==='conf')&&trHash()!==TR.h){TR.st='open';TR.h='';TR.note=o.name+' changed their offer.';trPub();}
  trDraw();
}
// the other player's trade state arrives with their presence
function trSeen(peer,raw,name,x,y){
  TR.names.set(peer,name);
  if(Number.isInteger(x)&&Number.isInteger(y))TR.at.set(peer,[x,y]);   // their latest spot, even before their figure has moved
  const t=trClean(raw);
  if(t)TR.seen.set(peer,t);else TR.seen.delete(peer);
  if(t&&t.to===MP.id&&t.st==='ask'&&TR.peer!==peer){
    const k=TR.asked.get(peer+t.m)||0;
    if(Date.now()-k>30000){TR.asked.set(peer+t.m,Date.now());const line=t.m==='duel'?name+' challenges you to a duel!':name+' wants to trade with you.';msg(line);trSys(line);trToast(peer,t.m);}
  }
  if(!t||t.to!==MP.id||t.st!=='ask'){if(TR.ui&&TR.ui.toastPeer===peer)trToast(null);TR.asked.delete(peer+'trade');TR.asked.delete(peer+'duel');}   // that request is over: a new one shows again
  if(TR.peer===peer)trTick();
}
function trLeft(peer){
  const p=TR.seen.get(peer);TR.seen.delete(peer);
  if(TR.ui&&TR.ui.toastPeer===peer)trToast(null);
  if(TR.peer!==peer||TR.st==='done'||TR.st==='won'||TR.st==='lost')return;
  if(TR.st==='fight'){
    if(p&&p.st==='lost'&&p.h===TR.h){TR.seen.set(peer,p);duelWin();return;}
    trEnd(trName(peer)+' left in the middle of the duel. Nobody wins: your stake comes back to you.');return;
  }
  // they confirmed this exact trade just before leaving: finish it on our side too
  if(TR.mode!=='duel'&&TR.st==='conf'&&p&&(p.st==='conf'||p.st==='done')&&p.h===TR.h){TR.seen.set(peer,p);trSwap();return;}
  trEnd(trName(peer)+' has left, so the '+(TR.mode==='duel'?'duel':'trade')+' was cancelled.');
}
function trOpts(tx,ty){
  if(!RM.room||(typeof curD!=='undefined'&&curD>=0))return [];
  const out=[];
  MP.others.forEach(o=>{if(o.x!==tx||o.y!==ty)return;
    if(TR.st==='fight'&&TR.peer===o.id){out.push(['Attack '+o.name,()=>duelAttack()]);out.push(['Forfeit the duel',()=>duelLose('forfeit')]);return;}
    out.push(['Trade with '+o.name,()=>trAsk(o.id,'trade')]);out.push(['Duel '+o.name,()=>trAsk(o.id,'duel')]);});
  return out;
}

// ===== Duels =====
// Set up like a trade (both put up stakes, accept, then confirm). Then each game fights the other player: your blows
// go out in your presence, and each player's own game takes the blows it receives off its own health. Whoever's
// health runs out first says so, and the winner's game hands over the stakes. Stakes are held aside while you fight
// (and kept in your save), so nothing can be eaten or dropped mid-fight; if the duel never finishes they come back.
var DU=null,duelW=0,duelL=0;   // duels won and lost (saved)   // var: the save code can look at it before this part of the script has run
const DUEL_MS=300000,DUEL_RUN=12;
function duelGive(o,c){   // into the bag, or the bank when it is full
  let banked=false;
  for(const k in o){const n=o[k];
    if(STACKS.test(k)){if(!addItem(k,n)){bank[k]=Math.min(99999,(bank[k]||0)+n);banked=true;}}
    else for(let i=0;i<n;i++)if(!addItem(k)){bank[k]=Math.min(99999,(bank[k]||0)+1);banked=true;}

function duelStart(){

    if(STACKS.test(k)){stk[k]=stackN(k)-n;if(stk[k]<=0){delete stk[k];const i=inv.indexOf(k);if(i>=0)inv.splice(i,1);}}

  }

function duelRange(){return ranged()||magicRng()?4:meleeReach();}
function duelAttack(){
  if(!DU||TR.st!=='fight')return;
  stopChop();
  if(DU.ev){DU.ev.remove();DU.ev=null;}
  const swing=()=>{
    if(!DU||TR.st!=='fight'){if(DU&&DU.ev){DU.ev.remove();DU.ev=null;}return;}
    const o=MP.others.get(DU.peer),p=TR.seen.get(DU.peer);if(!o||!p)return;
    const at=TR.at.get(DU.peer)||[o.x,o.y],dist=Math.abs(at[0]-px)+Math.abs(at[1]-py),R=duelRange();
    if(dist<1||dist>R){   // walk into reach; the next swing tries again
      const path=bfs((x,y)=>{const d=Math.abs(x-at[0])+Math.abs(y-at[1]);return d>=1&&d<=R;});
      if(path&&path.length)go(path);
      return;
    }
    const sp=armedSpell?curSpell():null,spOk=isAttackSpell(sp);let mag=false,src=null,bow=false,d;
    if(spOk){src=srcFor(sp);if(chargeOf(src)>=sp.c)mag=true;else{armedSpell=null;msg('Your '+nm(src)+' is out of charges.');}}
    if(!mag&&ranged()){if(ammo.n>0)bow=true;else if(dist>meleeReach()){msg('You are out of arrows!');return;}}
    if(mag){setCh(src,chargeOf(src)-sp.c);d=Phaser.Math.Between(1,spellMax(sp,src));}

    else{if(dist>meleeReach())return;d=Phaser.Math.Between(1,3+Math.floor(alvl()/2)+Math.max(0,axe)+wpnBonus()+dmgPray());}
    const ch=Math.max(0.3,Math.min(0.85,0.85-p.dd*0.02));   // their defense makes you miss more often
    if(Math.random()>ch)d=0;
    attackAnim(at[0],at[1]);

    ui();
  };
  DU.ev=scene.time.addEvent({delay:(gear.wp>=0&&gear.wt===2&&!ranged()&&!magicRng())?1700:1200,loop:true,callback:swing});

function duelTick(){

  if(p&&p.to===MP.id&&p.st==='lost'&&p.h===DU.h){duelWin();return;}
  if(!p||p.to!==MP.id||p.h!==DU.h||(p.st!=='fight'&&p.st!=='conf')){trEnd(o.name+' left the duel. Nobody wins: your stake comes back to you.');return;}

// Background tabs: the browser stops drawing the game, which froze fishing, chopping and mining.
// While the tab is hidden we keep the current gathering loop ticking on a plain timer, using real elapsed time,
// so you keep catching fish (until the bag is full) and nothing is lost when you come back.
(function(){
  let bgT=null,bgLast=0,bgAcc=0,bgEvt=null,bgFrame=-1;
  const tick=()=>{
    const now=Date.now(),dt=Math.min(now-bgLast,6*3600e3);bgLast=now;
    if(!chopEvt||!chopEvt.loop||!(chopEvt.delay>0)){bgEvt=null;bgAcc=0;return;}
    if(game.loop.frame!==bgFrame){bgFrame=game.loop.frame;bgEvt=chopEvt;bgAcc=chopEvt.elapsed||0;return;}   // the game is still drawing: it runs the loop itself
    if(chopEvt!==bgEvt){bgEvt=chopEvt;bgAcc=chopEvt.elapsed||0;}
    bgAcc+=dt;let n=0;
    while(chopEvt===bgEvt&&bgAcc>=bgEvt.delay&&n<5000){bgAcc-=bgEvt.delay;n++;try{bgEvt.callback.call(bgEvt.callbackScope);}catch(e){console.warn(e);break;}}
    if(chopEvt===bgEvt)bgEvt.elapsed=bgAcc;
  };
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden'){bgLast=Date.now();bgEvt=null;bgFrame=game.loop.frame;clearInterval(bgT);bgT=setInterval(tick,1000);}
    else if(bgT){tick();clearInterval(bgT);bgT=null;bgEvt=null;try{if(OAK.on)oakUpload();}catch(e){}}
  });
})();

        const mult=1+Math.min(FZ.combo-1,20)*0.1,gold=Math.random()<0.04;

        if(flvl()>b)msg('Level up! Fishing is now '+flvl()+'.');

    }});

  });
}
function fzTick(){

    'Ƨ':{n:'fish stall',verb:'Steal from',lv:18,xp:38,c:[0,0],one:['fs1','fs3','fs4'],cd:25},
    'ƨ':{n:'pottery stall',verb:'Steal from',lv:26,xp:50,c:[30,70],l:[['gm0',.05,1,1]],cd:30},

const thPPOf=m=>m&&m.t&&(TH.pp[Object.keys(MT).find(k=>MT[k]===m.t)]||null);
const thChance=lv=>Math.min(0.95,0.55+0.03*(thlvl()-lv));
function thGive(e){   // hand over the loot: coins straight to the pouch, items to the bag
  let got=[];
  const c=e.c&&e.c[1]?Phaser.Math.Between(e.c[0],e.c[1]):0;if(c>0){coins+=c;got.push(c+' coins');}
  const put=(id,n)=>{for(let j=0;j<(STACKS.test(id)?1:n);j++)if(!addItem(id,STACKS.test(id)?n:1)){dropAt(px,py,id,1);}got.push((n>1?n+' ':'')+nm(id));};
  if(e.one)put(e.one[Math.floor(Math.random()*e.one.length)],1);
  (e.l||[]).forEach(([id,ch,lo,hi])=>{if(Math.random()<ch)put(id,Phaser.Math.Between(lo,hi));});
  return got;

function thReady(lv,what){
  if(Date.now()<TH.stun){msg("You're still stunned! Wait a moment.");return false;}
  if(thlvl()<lv){msg('You need Thieving level '+lv+' to '+what+'.');return false;}
  if(inv.length>=CAPN()){msg('Your bag is full.');return false;}
  return true;
}

  stopChop();TH.stun=Date.now()+3500;
  if(dmg){const d=Phaser.Math.Between(dmg[0],dmg[1]);hp=Math.max(1,hp-d);pop(player.x,player.y-14,'-'+d,'#ff6b6b');}

}
function thXp(n){const b=thlvl();thxp+=n;const a=thlvl();return a>b?' Level up! Thieving is now '+a+'.':'';}
function thPick(m){
  const e=thPPOf(m)||TH.pp[m.t.tex];if(!e||!m.alive)return;
  if(!thReady(e.lv,'pickpocket '+an(m.t.name)))return;
  const path=bfs((x,y)=>Math.abs(x-m.x)+Math.abs(y-m.y)<=1&&!(x===m.x&&y===m.y));
  if(!path){msg("You can't reach them.");return;}
  msg('');go(path,()=>{
    if(Math.abs(px-m.x)+Math.abs(py-m.y)>1||!m.alive){msg('The '+m.t.name+' wandered off.');return;}
    msg('You reach into the '+m.t.name+"'s pocket...");
    chopEvt=scene.time.delayedCall(1100,()=>{
      chopEvt=null;
      if(Math.abs(px-m.x)+Math.abs(py-m.y)>1){msg('The '+m.t.name+' wandered off.');return;}
      if(Math.random()<thChance(e.lv)){const got=thGive(e),lu=thXp(e.xp);msg('You pick the '+m.t.name+"'s pocket: "+got.join(', ')+'.'+lu);ui();save();}
      else thCaught([1,1+Math.floor(e.lv/10)],'The '+m.t.name+' catches you and gives you a smack! You are stunned.');
    });
  });

function thStall(tx,ty){
  const ch=grid[ty][tx],e=TH.st[ch];if(!e)return;
  if(!thReady(e.lv,(e.verb==='Crack'?'crack ':'steal from ')+an(e.n)))return;

  const path=bfs((x,y)=>Math.abs(x-tx)+Math.abs(y-ty)===1);

  msg('');go(path,()=>{
    msg(e.trap?'You carefully search the pile for traps...':'You glance around and reach for the '+e.n+'...');
    chopEvt=scene.time.delayedCall(e.trap?1600:1100,()=>{

    });
  });
}

// Every player works out the same time and place from the clock, so no server is needed to agree on it.
const WB={every:3600000,window:1200000,warn:300000,

const wbSpot=slot=>WB.spots[((slot*2654435761)>>>0)%WB.spots.length];

function wbSay(key,text){if(WB.said[key])return;WB.said[key]=1;msg(text);wbBanner(text);}
function wbTick(){
  if(!player||startOpen)return;
  const m=wbMon();if(!m)return;
  const now=Date.now(),slot=wbSlot(now),into=now-slot*WB.every,active=into<WB.window,sp=wbSpot(slot);
  if(WB.every-into<=WB.warn)wbSay('w'+(slot+1),'The ground trembles... the Gloomhorn will rise in '+wbSpot(slot+1)[2]+' in '+(n=>n+(n===1?' minute!':' minutes!'))(Math.max(1,Math.ceil((WB.every-into)/60000))));
  if(active&&m.wbDead!==slot)wbSay('r'+slot,'The Gloomhorn has risen in '+sp[2]+'! Everyone who fights it gets a share of the loot.');
  if(smFollower()){if(!active&&m.alive){m.alive=false;m.c.setVisible(false);}return;}   // the host decides; we only hear about it
  if(active&&!m.alive&&m.wbDead!==slot){
    m.hx=m.x=sp[0];m.hy=m.y=sp[1];m.hp=m.t.hp;m.prov=0;m.alive=true;m.busy=false;m.hunt=false;m.dmgBy=null;m.myDmg=0;m.bs=null;m.wbSlot=slot;

    m.c.setPosition(m.x*T+T/2,m.y*T+T/2+OY).setVisible(true);barUp(m);
  }
  if(!active&&m.alive){
    m.alive=false;m.busy=false;m.c.setVisible(false);if(fightMon===m)stopChop();
    if(Math.abs(m.x-px)+Math.abs(m.y-py)<=20)msg('The Gloomhorn sinks back into the earth. It will rise again next hour.');
  }
}

  const slot=m.wbSlot!==undefined?m.wbSlot:wbSlot();m.wbDead=slot;
  if(!WB.said['d'+slot]){WB.said['d'+slot]=1;wbBanner('The Gloomhorn has been defeated! It will rise again next hour.');}   // banner only: the loot message stays in the message line
  if(RM.room&&SM.host)try{RM.room.presence({wb:slot}).catch(()=>{});}catch(e){}

  w.replaceChildren(in_);w.style.display='flex';
}

// The welcome box: a short explanation of the game, shown the first time a character steps into the world
function showWelcome(){
  if(welSeen||startOpen||document.getElementById('welBox'))return;
  const st=document.createElement('style');
  st.textContent='#welBox{position:fixed;inset:0;z-index:46;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)}'
   +'#welBox .in{width:min(420px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:rgba(32,35,42,.97);border:1px solid #c9982a;border-radius:8px;padding:14px 16px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#f1e9c8;box-shadow:0 6px 20px rgba(0,0,0,.5)}'
   +'#welBox h2{margin:0 0 6px;font-size:17px;color:#ffe066}#welBox p{margin:0 0 8px}#welBox ul{margin:0 0 12px;padding-left:18px}#welBox li{margin:3px 0}#welBox b{color:#ffe066;font-weight:normal}'
   +'#welBox button{display:block;width:100%;padding:9px;font:inherit;font-size:14px;color:#1b1610;background:#e0b040;border:0;border-radius:6px;cursor:pointer}';
  document.head.appendChild(st);
  const box=document.createElement('div');box.id='welBox';
  box.innerHTML='<div class="in" role="dialog" aria-label="Welcome to Oakheart"><h2>Welcome to Oakheart!</h2>'
   +'<p>A world to explore with friends: train your skills, take on quests and fight monsters.'+(tutOn()?' You start on Tutorial Island: follow the yellow arrow and the tips at the top to learn the basics.':'')+'</p><ul>'
   +'<li><b>Tap</b> the ground to walk. Tap trees, rocks, fishing spots and monsters to use them.</li>'
   +'<li><b>Train skills</b> like Woodcutting, Fishing, Mining, Cooking, Smithing, Crafting, Magic and combat.</li>'
   +'<li><b>Sell</b> what you gather at shops, and keep your best things in the <b>bank</b>.</li>'
   +'<li>People with a <b>!</b> over their head have <b>quests</b> for you.</li>'
   +'<li><b>Right-click</b> (or press and hold) another player to trade or duel.</li>'
   +'<li>The buttons along the bottom open your Skills, Gear, Quests, Spells and Bag.</li>'
   +'</ul><button type="button">Start playing</button></div>';
  document.body.appendChild(box);
  const close=()=>{welSeen=true;box.remove();try{save();}catch(e){}};
  box.querySelector('button').addEventListener('click',close);
  box.addEventListener('pointerdown',e=>{if(e.target===box)close();});
  box.querySelector('button').focus({preventScroll:true});
}
// The game fills the window: when it changes size or the phone rotates, rebuild the view size
let rsT=null;
['resize','orientationchange'].forEach(ev=>window.addEventListener(ev,()=>{clearTimeout(rsT);rsT=setTimeout(()=>{try{const v=viewSize();game.scale.setGameSize(v[0],v[1]);game.scale.refresh();}catch(e){}},150);}));
</script>
